{% extends "base.html" %}

{% block title %}Server template · MiniCloud{% endblock %}

{% block content %}
  <h1 class="h3 mb-3">{% if object %}Edit{% else %}Create{% endif %} server template</h1>
  <form method="post" class="card shadow-sm"><div class="card-body">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary">Save template</button><a class="btn btn-link" href="{% url 'servers:template-list' %}">Cancel</a></div></form>
{% endblock %}
