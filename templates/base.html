<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MiniCloud{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #101a26; --muted: #65727f; --paper: #f3f6fa; --mint: #bfdcf7; --line: #d5dfeb; --coral: #ee765d; }
    body { background: var(--paper) !important; color: var(--ink); font-family: "Manrope", sans-serif; }
    .navbar { background: var(--ink) !important; }
    .navbar-brand, h1, h2, h3, h4 { letter-spacing: -0.02em; }
    .font-mono { font-family: "DM Mono", monospace; }
    .dashboard-card { border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 12px 30px rgba(23, 33, 31, .05); }
    .status-dot { display: inline-block; width: .55rem; height: .55rem; border-radius: 50%; background: var(--muted); }
    .status-running { background: #2f86dd; } .status-failed { background: var(--coral); } .status-stopped { background: #d09a38; }
    .btn-success { --bs-btn-bg: #1a63b8; --bs-btn-border-color: #1a63b8; --bs-btn-hover-bg: #124c8c; --bs-btn-hover-border-color: #124c8c; --bs-btn-active-bg: #124c8c; --bs-btn-active-border-color: #124c8c; --bs-btn-disabled-bg: #1a63b8; --bs-btn-disabled-border-color: #1a63b8; }
    .metric-value { font-size: 1.55rem; font-weight: 800; }
    .chart-wrap { height: 270px; position: relative; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="{% url 'servers:list' %}">MiniCloud</a>
      {% if request.user.is_authenticated %}
        <span class="navbar-text text-white">{{ request.user.username }}</span>
      {% endif %}
    </div>
  </nav>
  <main class="container pb-5">
    {% for message in messages %}
      <div class="alert alert-{{ message.tags|default:'info' }}" role="alert">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
